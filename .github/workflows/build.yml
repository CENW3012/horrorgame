name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-linux:
    runs-on: ubuntu-latest

    env:
      SDL3_PREFIX: ${{ github.workspace }}/.sdl3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev \
            libpng-dev libjpeg-dev

      - name: Cache SDL3 & SDL3_image
        id: cache-sdl3
        uses: actions/cache@v4
        with:
          path: .sdl3
          key: sdl3-linux-3.2.0

      - name: Build SDL3
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          curl -fsSL \
            https://github.com/libsdl-org/SDL/archive/refs/tags/release-3.2.0.tar.gz \
            | tar -xz -C /tmp
          cmake -S /tmp/SDL-release-3.2.0 -B /tmp/sdl3-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$SDL3_PREFIX
          cmake --build /tmp/sdl3-build
          cmake --install /tmp/sdl3-build

      - name: Build SDL3_image
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          curl -fsSL \
            https://github.com/libsdl-org/SDL_image/archive/refs/tags/release-3.0.0.tar.gz \
            | tar -xz -C /tmp
          cmake -S /tmp/SDL_image-release-3.0.0 -B /tmp/sdl3image-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$SDL3_PREFIX \
            -DSDL3_DIR=$SDL3_PREFIX/lib/cmake/SDL3
          cmake --build /tmp/sdl3image-build
          cmake --install /tmp/sdl3image-build

      - name: Configure with CMake
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$SDL3_PREFIX

      - name: Build
        run: cmake --build build

      - name: Run game headlessly
        run: |
          cd build
          export LD_LIBRARY_PATH=$SDL3_PREFIX/lib:$LD_LIBRARY_PATH
          SDL_VIDEODRIVER=offscreen SDL_AUDIODRIVER=dummy timeout 5 ./horrorgame
          rc=$?
          if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then
            echo "Game crashed with exit code $rc"
            exit 1
          fi
          echo "Game ran successfully (exit code: $rc)"

      - name: Package Linux artifact
        run: |
          mkdir -p horrorgame-linux
          cp build/horrorgame horrorgame-linux/
          cp -r build/assets horrorgame-linux/
          cp -r build/maps   horrorgame-linux/
          # Bundle SDL3 shared libraries so the binary runs without a local build
          cp $SDL3_PREFIX/lib/libSDL3.so*       horrorgame-linux/ 2>/dev/null || true
          cp $SDL3_PREFIX/lib/libSDL3_image.so* horrorgame-linux/ 2>/dev/null || true
          zip -r horrorgame-linux.zip horrorgame-linux/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: horrorgame-linux
          path: horrorgame-linux.zip

  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SDL3 and FFmpeg with vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg integrate install
          .\vcpkg install sdl3:x64-windows sdl3-image:x64-windows ffmpeg:x64-windows

      - name: Create build directory
        run: mkdir build

      - name: Configure with CMake
        shell: bash
        run: |
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake ..

      - name: Build Release
        run: |
          cd build
          cmake --build . --config Release

      - name: Prepare Windows package
        shell: bash
        run: |
          mkdir -p horrorgame-windows
          cp build/Release/horrorgame.exe horrorgame-windows/ || cp build/horrorgame.exe horrorgame-windows/
          cp -r assets horrorgame-windows/ || echo "Assets not found, continuing..."
          cp -r maps horrorgame-windows/ || echo "Maps not found, continuing..."
          
          # Copy all DLLs installed by vcpkg (SDL3, SDL3_image, FFmpeg, and their deps)
          find vcpkg/installed/x64-windows/bin -name "*.dll" -exec cp {} horrorgame-windows/ \; 2>/dev/null || true
          
          # List what we copied
          ls -la horrorgame-windows/

      - name: Create release package
        shell: bash
        run: |
          7z a horrorgame-windows.zip horrorgame-windows/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: horrorgame-windows
          path: horrorgame-windows.zip

  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SDL3 (macOS)
        run: |
          brew install sdl3 sdl3_image cmake

      - name: Create build directory
        run: mkdir build

      - name: Configure with CMake
        run: |
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Create macOS app bundle
        run: |
          mkdir -p horrorgame.app/Contents/MacOS
          mkdir -p horrorgame.app/Contents/Resources
          
          # Copy executable
          cp build/horrorgame horrorgame.app/Contents/MacOS/ || exit 1
          chmod +x horrorgame.app/Contents/MacOS/horrorgame
          
          # Copy assets
          cp -r assets horrorgame.app/Contents/MacOS/ || echo "Assets folder not found"
          
          # Create Info.plist
          cat > horrorgame.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Metamorph</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleExecutable</key>
              <string>horrorgame</string>
              <key>CFBundleIdentifier</key>
              <string>com.russellchr.metamorph</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
          </dict>
          </plist>
          EOF

      - name: Create release package
        run: |
          zip -r horrorgame-macos.zip horrorgame.app/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: horrorgame-macos
          path: horrorgame-macos.zip

  create-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            horrorgame-linux.zip
            horrorgame-windows/horrorgame-windows.zip
            horrorgame-macos/horrorgame-macos.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
